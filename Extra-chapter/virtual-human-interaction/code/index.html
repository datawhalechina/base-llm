<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>小禾｜AI 學習夥伴</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
        color: #172033;
        background: #f5f7fb;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      main { width: min(760px, 100%); border: 1px solid #dfe5ef; border-radius: 18px; background: white; box-shadow: 0 18px 55px #24365b14; overflow: hidden; }
      header { padding: 24px 28px 18px; background: linear-gradient(130deg, #eaf5ff, #f5f0ff); }
      h1 { margin: 0 0 6px; font-size: 1.35rem; }
      .subtitle, #mode { color: #59657a; font-size: .9rem; margin: 0; }
      #mode { margin-top: 8px; font-size: .8rem; }
      #messages { display: flex; flex-direction: column; gap: 14px; min-height: 340px; max-height: 52vh; overflow-y: auto; padding: 24px 28px; }
      .bubble { max-width: 86%; padding: 12px 15px; border-radius: 14px; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; }
      .assistant { align-self: flex-start; background: #f0f3f9; }
      .user { align-self: flex-end; background: #245bd7; color: white; }
      .actions { display: flex; gap: 7px; margin-top: 7px; }
      .actions button { border: 0; background: transparent; color: #52617b; padding: 4px 0; cursor: pointer; font-size: .8rem; }
      form { padding: 0 28px 24px; }
      textarea { width: 100%; min-height: 84px; resize: vertical; border: 1px solid #d7deea; border-radius: 12px; padding: 13px; font: inherit; }
      textarea:focus { outline: 2px solid #93b4ff; border-color: #7197eb; }
      .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; margin-top: 10px; }
      button { font: inherit; }
      .primary { border: 0; border-radius: 9px; padding: 10px 16px; background: #245bd7; color: white; cursor: pointer; }
      .secondary { border: 1px solid #d4dceb; border-radius: 9px; padding: 9px 13px; background: white; color: #34425a; cursor: pointer; }
      button:disabled { opacity: .55; cursor: not-allowed; }
      #status { min-height: 1.3em; margin: 10px 0 0; color: #59657a; font-size: .85rem; }
      .footnote { padding: 0 28px 20px; color: #768196; font-size: .78rem; line-height: 1.5; }
      @media (max-width: 520px) { body { padding: 10px; } header, #messages { padding-left: 18px; padding-right: 18px; } form, .footnote { padding-left: 18px; padding-right: 18px; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>🌱 小禾｜AI 學習夥伴</h1>
        <p class="subtitle">用文字或語音聊一個學習問題；小禾會記住這段會話最近幾輪。</p>
        <p id="mode">正在載入模式…</p>
      </header>
      <section id="messages" aria-live="polite" aria-label="對話內容"></section>
      <form id="chat-form">
        <label for="message">你的訊息</label>
        <textarea id="message" maxlength="2000" placeholder="例如：我叫小明，最近在學 Transformer…" required></textarea>
        <div class="controls">
          <button class="primary" id="send" type="submit">送出</button>
          <button class="secondary" id="voice" type="button">語音輸入</button>
          <button class="secondary" id="reset" type="button">重設對話</button>
        </div>
        <p id="status" role="status"></p>
      </form>
      <p class="footnote">離線演示模式使用固定規則，並非 LLM。語音辨識由瀏覽器提供，支援度與資料處理方式依瀏覽器而異；不使用語音時可直接輸入文字。</p>
    </main>
    <script>
      const messages = document.querySelector("#messages");
      const input = document.querySelector("#message");
      const form = document.querySelector("#chat-form");
      const sendButton = document.querySelector("#send");
      const statusLine = document.querySelector("#status");
      let sessionId = "";

      function addMessage(role, text) {
        const row = document.createElement("article");
        row.className = `bubble ${role}`;
        const body = document.createElement("div");
        body.textContent = text;
        row.append(body);
        if (role === "assistant" && "speechSynthesis" in window) {
          const actions = document.createElement("div");
          actions.className = "actions";
          const speak = document.createElement("button");
          speak.type = "button";
          speak.textContent = "朗讀";
          speak.addEventListener("click", () => {
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(new SpeechSynthesisUtterance(text));
          });
          actions.append(speak);
          row.append(actions);
        }
        messages.append(row);
        messages.scrollTop = messages.scrollHeight;
      }

      async function createSession() {
        const response = await fetch("/api/session");
        if (!response.ok) throw new Error("無法建立新會話");
        const data = await response.json();
        sessionId = data.session_id;
      }

      async function loadConfig() {
        const response = await fetch("/api/config");
        const config = await response.json();
        document.querySelector("#mode").textContent = config.mode === "api"
          ? `模型模式 · 最近保留 ${config.max_history_turns} 輪`
          : `離線演示模式 · 最近保留 ${config.max_history_turns} 輪`;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const message = input.value.trim();
        if (!message || !sessionId) return;
        addMessage("user", message);
        input.value = "";
        sendButton.disabled = true;
        statusLine.textContent = "小禾正在整理…";
        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ session_id: sessionId, message }),
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.detail || "請求失敗");
          addMessage("assistant", data.reply);
          statusLine.textContent = "";
        } catch (error) {
          statusLine.textContent = `發生錯誤：${error.message}`;
        } finally {
          sendButton.disabled = false;
          input.focus();
        }
      });

      document.querySelector("#reset").addEventListener("click", async () => {
        if (sessionId) {
          await fetch("/api/reset", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ session_id: sessionId }),
          });
        }
        messages.replaceChildren();
        statusLine.textContent = "已建立新會話。";
        await createSession();
      });

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const voiceButton = document.querySelector("#voice");
      if (!SpeechRecognition) {
        voiceButton.disabled = true;
        voiceButton.title = "此瀏覽器不支援語音辨識，請使用文字輸入。";
      } else {
        voiceButton.addEventListener("click", () => {
          const recognition = new SpeechRecognition();
          recognition.lang = "zh-CN";
          recognition.interimResults = false;
          recognition.maxAlternatives = 1;
          recognition.onstart = () => { statusLine.textContent = "正在聆聽…"; };
          recognition.onresult = (event) => {
            input.value = event.results[0][0].transcript;
            input.focus();
            statusLine.textContent = "辨識完成；確認文字後按「送出」。";
          };
          recognition.onerror = () => { statusLine.textContent = "語音辨識未完成；你仍可直接輸入文字。"; };
          recognition.onend = () => {
            if (statusLine.textContent === "正在聆聽…") statusLine.textContent = "";
          };
          recognition.start();
        });
      }

      Promise.all([createSession(), loadConfig()]).catch((error) => {
        statusLine.textContent = error.message;
      });
    </script>
  </body>
</html>
